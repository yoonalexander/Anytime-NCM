[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anytime-ncm"
version = "0.1.0"
description = "Research inspection and reproducibility tools for closed frozen-NCM adaptive stopping studies"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license-files = ["RIGHTS.md", "NOTICE.md"]
classifiers = ["Development Status :: 3 - Alpha", "Environment :: Console", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: Scientific/Engineering :: Artificial Intelligence"]

[project.urls]
Repository = "https://github.com/yoonalexander/Anytime-NCM"
Research = "https://github.com/yoonalexander/Anytime-NCM/blob/main/docs/PROJECT_OUTCOME.md"
Issues = "https://github.com/yoonalexander/Anytime-NCM/issues"

[project.scripts]
anytime-ncm = "anytime_ncm.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["anytime_ncm*"]

[tool.setuptools.package-data]
anytime_ncm = ["snapshot.json", "upstream-NCM-LICENSE.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
