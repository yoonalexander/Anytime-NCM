name: Research snapshot
on:
  push:
    branches: [main]
    paths: ['src/**', 'pyproject.toml', 'MANIFEST.in', 'scripts/verify_distribution.py', '.github/workflows/snapshot.yml', 'README.md', 'NOTICE.md', 'RIGHTS.md', 'docs/delivery/INSTALL.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build "setuptools>=77" wheel
      - run: python -m build --sdist --outdir dist
      - run: python scripts/verify_distribution.py --sdist dist/anytime_ncm-0.1.0.tar.gz --work-dir build/acceptance --output build/acceptance.json
